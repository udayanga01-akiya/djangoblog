{% extends 'blog/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto mt-4 text-white">
    <h1>Create an account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>
{% endblock %}
