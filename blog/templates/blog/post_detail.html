{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card bg-dark text-white p-4 rounded shadow">
        <h2>{{ post.title }}</h2>
        <div class="d-flex align-items-center mb-3">
            <span class="badge bg-primary me-2">
                {% if post.category %}{{ post.category }}{% else %}General{% endif %}
            </span>
            <small class="text-muted">{{ post.created_at|date:"F d, Y" }}</small>
        </div>

        <!-- Photo එක පෙන්නන කොටස -->
        {% if post.image %}
            <div class="my-3 text-center">
                <img src="{{ post.image.url }}" class="img-fluid rounded" alt="{{ post.title }}" style="max-height: 450px; width: 100%; object-fit: cover;">
            </div>
        {% endif %}

        <div class="mt-3 fs-5">
            <p>{{ post.content }}</p>
        </div>

        <div class="mt-4 d-flex gap-2 border-top pt-3 border-secondary">
            <a href="{% url 'post_update' post.slug %}" class="btn btn-warning px-4">Edit Post</a>
            <a href="{% url 'post_delete' post.slug %}" class="btn btn-danger px-4">Delete Post</a>
            <a href="{% url 'home' %}" class="btn btn-outline-light ms-auto">← Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
